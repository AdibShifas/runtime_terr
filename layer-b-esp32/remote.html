<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Sheldon Rover RC</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-color: #1a1a1a;
            --text-color: #e0e0e0;
            --accent-color: #00ff41; /* Cyberpunk Green */
            --danger-color: #ff3333;
            --knob-color: rgba(255, 255, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            touch-action: none; /* Critical for Joystick */
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- HEADER --- */
        header {
            background: var(--panel-color);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            height: 50px;
        }

        .status-pill {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            background: #333;
            color: #888;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-pill.connected {
            background: rgba(0, 255, 65, 0.2);
            color: var(--accent-color);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.1);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        /* --- MAIN JOYSTICK ARENA --- */
        #joystick-container {
            flex-grow: 1;
            position: relative;
            background: radial-gradient(circle at center, #151515 0%, #0a0a0a 100%);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Overlay Text for Joysticks */
        .stick-label {
            position: absolute;
            bottom: 20%;
            font-size: 14px;
            opacity: 0.3;
            pointer-events: none;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .stick-label.left { left: 20%; }
        .stick-label.right { right: 20%; }

        /* --- STOP BUTTON --- */
        #stop-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(255, 51, 51, 0.15);
            border: 2px solid var(--danger-color);
            color: var(--danger-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.1);
            transition: all 0.1s;
            z-index: 10;
        }

        #stop-btn:active {
            background: var(--danger-color);
            color: white;
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* --- CONTROL PANEL (Bottom) --- */
        #control-panel {
            background: var(--panel-color);
            padding: 15px;
            border-top: 1px solid #333;
            max-height: 40vh;
            overflow-y: auto;
        }

        h3 {
            margin: 0 0 10px 0;
            font-size: 12px;
            text-transform: uppercase;
            color: #666;
            letter-spacing: 1px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            background: #252525;
            border: 1px solid #444;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            touch-action: manipulation; /* Allow tap */
        }

        button:active {
            background: #444;
            transform: translateY(1px);
        }

        button.action {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: rgba(0, 255, 65, 0.05);
        }

        button.action:active {
            background: var(--accent-color);
            color: black;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            margin-bottom: 8px;
            font-size: 16px; /* Prevents zoom on iPhone */
        }

        select {
            width: 100%;
            padding: 12px;
            background: #252525;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            margin-bottom: 8px;
            appearance: none;
            font-size: 16px;
        }

        /* --- DEBUG TERMINAL --- */
        #terminal {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: #666;
            margin-top: 10px;
            height: 60px;
            overflow: hidden;
            border-top: 1px solid #222;
            padding-top: 5px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<header>
    <div style="font-weight:900; letter-spacing:-0.5px;">SHELDON<span style="color:var(--accent-color)">.ROVER</span></div>
    <div id="status-indicator" class="status-pill">
        <div class="status-dot"></div>
        <span id="status-text">DISCONNECTED</span>
    </div>
</header>

<div id="joystick-container">
    <canvas id="joystick-canvas"></canvas>
    <div class="stick-label left">Throttle</div>
    <div class="stick-label right">Steer</div>
    <button id="stop-btn" ontouchstart="sendStop()">STOP</button>
</div>

<div id="control-panel">
    
    <!-- Audio Presets -->
    <h3>Audio / Personality</h3>
    <div class="grid-2">
        <button onclick="sendEvent('BOOT')">🔊 Boot Up</button>
        <button onclick="sendEvent('COLLISION')">💥 Collision</button>
        <button onclick="sendEvent('STUCK')">⚠️ Stuck</button>
        <button onclick="sendEvent('IDLE_TOO_LONG')">💤 Bored</button>
    </div>

    <!-- Custom Speech -->
    <h3>Custom Voice</h3>
    <input type="text" id="tts-input" placeholder="Enter description (e.g. 'Sarcastic hello')">
    <button class="action" style="width:100%" onclick="sendCustomTTS()">Generative Speak</button>

    <!-- Terminal -->
    <div id="terminal">Initializing...</div>
</div>

<script>
    // --- CONFIGURATION ---
    const ESP_IP = "http://192.168.4.1";
    const UPDATE_RATE_MS = 100; // 10Hz

    // --- STATE ---
    let driveState = { l: 0, r: 0 };
    let lastSentState = { l: 0, r: 0 };
    let isTouching = false;
    let updateInterval = null;

    // --- JOYSTICK LOGIC ---
    const canvas = document.getElementById('joystick-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    
    // Pointers map: id -> {x, y, type: 'left'|'right', originY}
    let pointers = {}; 

    function resize() {
        width = canvas.width = canvas.parentElement.clientWidth;
        height = canvas.height = canvas.parentElement.clientHeight;
        draw();
    }
    window.addEventListener('resize', resize);
    resize();

    // Touch Handlers
    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        isTouching = true;
        for (let t of e.changedTouches) {
            const type = t.clientX < width / 2 ? 'left' : 'right';
            pointers[t.identifier] = {
                id: t.identifier,
                x: t.clientX,
                y: t.clientY,
                originX: t.clientX,
                originY: t.clientY,
                type: type
            };
        }
        updateDriveFromPointers();
        draw();
        startLoop();
    });

    canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        for (let t of e.changedTouches) {
            if (pointers[t.identifier]) {
                pointers[t.identifier].x = t.clientX;
                pointers[t.identifier].y = t.clientY;
            }
        }
        updateDriveFromPointers();
        draw();
    });

    const endTouch = e => {
        e.preventDefault();
        for (let t of e.changedTouches) {
            delete pointers[t.identifier];
        }
        
        // If no fingers, reset drive
        if (Object.keys(pointers).length === 0) {
            isTouching = false;
            driveState = { l: 0, r: 0 };
            stopLoop(); // Will send one final 0,0
        } else {
            updateDriveFromPointers();
        }
        draw();
    };

    canvas.addEventListener('touchend', endTouch);
    canvas.addEventListener('touchcancel', endTouch);

    // Calc Logic
    function updateDriveFromPointers() {
        let throttle = 0;
        let steering = 0;
        const maxDist = height / 3; // Max throw distance in pixels

        for (let key in pointers) {
            let p = pointers[key];
            let dy = p.originY - p.y; // Up is positive
            let dx = p.x - p.originX; // Right is positive

            // Normalize -1 to 1
            let valY = Math.max(-1, Math.min(1, dy / maxDist));
            let valX = Math.max(-1, Math.min(1, dx / maxDist));

            if (p.type === 'left') {
                throttle = valY; // Left stick = Throttle
            } else {
                steering = valX; // Right stick = Steering
            }
        }

        // Differential Drive Mixer
        // Left = Throttle + Steering
        // Right = Throttle - Steering
        let l = throttle + steering;
        let r = throttle - steering;

        // Clamp
        l = Math.max(-1, Math.min(1, l));
        r = Math.max(-1, Math.min(1, r));

        // Exponential Curve (for better control)
        // Sign * Value^2
        // l = Math.sign(l) * (l * l);
        // r = Math.sign(r) * (r * r);

        // Convert to PWM (255 max)
        driveState.l = Math.round(l * 255);
        driveState.r = Math.round(r * 255);
    }

    // Drawing
    function draw() {
        ctx.clearRect(0, 0, width, height);

        // Draw Dividers
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(width/2, 20);
        ctx.lineTo(width/2, height-20);
        ctx.stroke();

        // Draw Joysticks
        for (let key in pointers) {
            let p = pointers[key];
            
            // Base
            ctx.beginPath();
            ctx.arc(p.originX, p.originY, 40, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.stroke();

            // Knob
            ctx.beginPath();
            ctx.arc(p.x, p.y, 25, 0, Math.PI*2);
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent-color');
            ctx.fill();
            
            // Connector
            ctx.beginPath();
            ctx.moveTo(p.originX, p.originY);
            ctx.lineTo(p.x, p.y);
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent-color');
            ctx.stroke();
        }
    }


    // --- NETWORKING ---
    function log(msg) {
        const term = document.getElementById('terminal');
        term.innerText = `> ${msg}\n` + term.innerText.substring(0, 100);
    }

    function setStatus(connected) {
        const el = document.getElementById('status-indicator');
        const txt = document.getElementById('status-text');
        if (connected) {
            el.classList.add('connected');
            txt.innerText = "CONNECTED";
        } else {
            el.classList.remove('connected');
            txt.innerText = "DISCONNECTED";
        }
    }

    function startLoop() {
        if (!updateInterval) {
            updateInterval = setInterval(sendDrive, UPDATE_RATE_MS);
        }
    }

    function stopLoop() {
        if (updateInterval) {
            clearInterval(updateInterval);
            updateInterval = null;
            // Send one final stop 100ms later to be sure
            setTimeout(sendDrive, 100);
        }
    }

    async function sendDrive() {
        // Debounce: verify change
        // const hasChanged = (driveState.l !== lastSentState.l || driveState.r !== lastSentState.r);
        // Actually, for UDP/Reliability, we might want to just stream it.
        // But for HTTP POST, let's allow small delta to save network
        
        let shouldSend = (driveState.l !== lastSentState.l || driveState.r !== lastSentState.r);

        // Heartbeat logic could go here, but keep simple
        if (!shouldSend && !isTouching) return;

        try {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), 80); // 80ms timeout

            await fetch(`${ESP_IP}/drive`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(driveState),
                signal: controller.signal
            });
            clearTimeout(id);
            
            lastSentState = { ...driveState };
            setStatus(true);
            // log(`Drive: ${driveState.l}, ${driveState.r}`);

        } catch (e) {
            setStatus(false);
            // Don't log every frame error to avoid lag, maybe only on status change
        }
    }

    async function sendStop() {
        driveState = { l: 0, r: 0 };
        updateDriveFromPointers(); // Reset visual math
        pointers = {}; // Kill joysticks
        draw();
        
        log("STOP COMMAND SENT");
        if (navigator.vibrate) navigator.vibrate(200);

        try {
            await fetch(`${ESP_IP}/stop`, { method: 'POST' });
        } catch(e) { log("Error sending STOP"); }
    }

    async function sendEvent(evtName) {
        log(`Triggering: ${evtName}`);
        if (navigator.vibrate) navigator.vibrate(50);
        try {
            await fetch(`${ESP_IP}/say_id`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: evtName })
            });
        } catch(e) { log("Failed to send event"); }
    }

    async function sendCustomTTS() {
        const text = document.getElementById('tts-input').value;
        if (!text) return;
        
        log(`Generating: "${text}"...`);
        try {
            await fetch(`${ESP_IP}/say_desc`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ desc: text })
            });
            document.getElementById('tts-input').value = ""; // Clear
        } catch(e) { log("TTS Failed"); }
    }

</script>
</body>
</html>
